services:
  - type: web
    name: xldv-2026
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_EXCEL
        value: /opt/render/project/src/data/Bo_bieu_mau_du_lieu_XLDV_DHNN.xlsx
      - key: DATABASE_URL
        fromDatabase:
          name: xldv-2026-db
          property: connectionString

databases:
  - name: xldv-2026-db
    plan: basic-256mb
