<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XLDV 2026 | Dashboard</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f6f8fc;--blue:#1769e0;--navy:#103c75;--line:#e5eaf2}*{box-sizing:border-box}body{margin:0}.login-page{min-height:100vh;background:linear-gradient(135deg,#eef5ff 0%,#f8fbff 55%,#edf3fb 100%);display:flex;align-items:center;justify-content:center;padding:24px}.login-card{width:min(440px,100%);background:#fff;border:1px solid #e3eaf4;border-radius:22px;box-shadow:0 20px 55px rgba(16,60,117,.12);overflow:hidden}.login-head{padding:30px 32px 20px;text-align:center}.logo{width:64px;height:64px;border-radius:18px;background:#eaf2ff;color:var(--blue);display:grid;place-items:center;font-size:25px;font-weight:900;margin:0 auto 14px}.org{font-size:13px;font-weight:800;letter-spacing:.3px;color:var(--navy);text-transform:uppercase}.title{font-size:25px;font-weight:850;margin:8px 0;color:#12233e}.sub{font-size:14px;color:#68758a;line-height:1.5}.login-body{padding:10px 32px 32px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#344054}.input,select{width:100%;padding:13px 14px;border:1px solid #d6deea;border-radius:11px;background:#fff;font:inherit;outline:none;transition:.2s}.input:focus,select:focus{border-color:#6da2ef;box-shadow:0 0 0 4px #1769e012}.password{position:relative}.password .input{padding-right:48px}.eye{position:absolute;right:8px;top:7px;border:0;background:transparent;padding:8px;color:#667085;cursor:pointer}.btn{border:0;border-radius:11px;padding:12px 16px;cursor:pointer;background:var(--blue);color:#fff;font-weight:800;font:inherit}.login-btn{width:100%;margin-top:7px}.sso{width:100%;margin-top:10px;background:#fff;color:var(--navy);border:1px solid #d8e0ec}.or{display:flex;align-items:center;gap:10px;color:#98a2b3;font-size:12px;margin:16px 0}.or:before,.or:after{content:'';height:1px;background:#e8edf4;flex:1}.demo{font-size:11px;color:#98a2b3;text-align:center;margin-top:15px}.footer{text-align:center;font-size:11px;color:#98a2b3;padding:0 20px 22px}.app{min-height:100vh}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brandbox{display:flex;align-items:center;gap:12px}.brandmark{width:42px;height:42px;border-radius:12px;background:#eaf2ff;color:var(--blue);display:grid;place-items:center;font-weight:900}.brandname{font-weight:850;color:var(--navy)}.brandsub{font-size:11px;color:#8491a5;margin-top:2px}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#e9f1ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.main{max-width:1480px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.hero h1{margin:0 0 5px;font-size:26px}.muted{color:#728096;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf4ff;color:#2259b5;font-size:12px;font-weight:700}.live{background:#ecfdf3;color:#147d43}.nav{display:flex;gap:8px;margin:0 0 18px}.nav button{background:#fff;color:#475467;border:1px solid #dce4ee}.nav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#eef4ff;color:#1b5fc9}.danger{background:#fff1f1;color:#c43232}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 22px rgba(31,52,85,.05)}.kpi{padding:18px}.kpi .ico{font-size:20px}.kpi b{font-size:29px;display:block;margin-top:7px;color:#102a50}.filters{padding:15px;display:grid;grid-template-columns:2fr repeat(6,1fr) auto;gap:9px;margin-bottom:14px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.chart{padding:18px;min-height:300px}.bar{height:220px;display:flex;align-items:end;gap:10px;padding:22px 10px 12px}.bar i{flex:1;background:linear-gradient(180deg,#3e83ef,#1769e0);border-radius:7px 7px 0 0;position:relative;min-width:22px}.bar span{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:#667085}.bar em{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #edf1f6;text-align:left;white-space:nowrap}.table th{background:#fafbfd;position:sticky;top:0;color:#475467}.alert{color:#b42318;background:#fff0ef}.ok{color:#147d43;background:#ecfdf3}.status{font-size:12px;padding:6px 10px;border-radius:999px}.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:12px 15px;border-radius:11px;display:none;z-index:20;box-shadow:0 10px 30px #0002}.hidden{display:none}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(3,1fr)}.charts{grid-template-columns:1fr}}@media(max-width:700px){.topbar{padding:0 15px}.main{padding:15px}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.hero{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s);let token=localStorage.getItem('xldv_token'),me=null,state={tab:'dashboard'};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(url,opt);if(r.status===401){localStorage.removeItem('xldv_token');token=null;renderLogin();throw Error('Phiên đăng nhập đã hết hạn')}if(!r.ok){let e={};try{e=await r.json()}catch{}throw Error(e.error||'Có lỗi xảy ra')}return r}
function toast(x){const t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function renderLogin(){document.body.innerHTML=`<div class="login-page"><div class="login-card"><div class="login-head"><div class="logo">UFLS</div><div class="org">TRƯỜNG ĐẠI HỌC NGOẠI NGỮ</div><div class="org">ĐẠI HỌC ĐÀ NẴNG</div><div class="title">Dashboard theo dõi XLDV 2026</div><div class="sub">Hệ thống theo dõi, đối soát và báo cáo kết quả xếp lớp tiếng Anh đầu vào</div></div><div class="login-body"><div class="field"><label>Tên đăng nhập</label><input id="u" class="input" placeholder="Nhập tên đăng nhập" value="admin"></div><div class="field"><label>Mật khẩu</label><div class="password"><input id="p" class="input" type="password" placeholder="Nhập mật khẩu" value="admin123"><button class="eye" onclick="togglePass()">◉</button></div></div><button class="btn login-btn" onclick="login()">Đăng nhập</button><div class="or">hoặc</div><button class="btn sso" onclick="toast('SSO ĐHĐN sẽ được kết nối trong môi trường triển khai chính thức')">🛡 &nbsp;Đăng nhập SSO (ĐHĐN)</button><div class="demo">Demo: admin/admin123 · bgh/bgh123 · dhspkt/dhspkt123</div></div><div class="footer">© 2026 Trường Đại học Ngoại ngữ – Đại học Đà Nẵng</div></div></div>`}
function togglePass(){const p=$('#p');p.type=p.type==='password'?'text':'password'}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.setItem('xldv_token',token);me=d.user;await boot()}catch(e){toast(e.message)}}
async function boot(){try{me=await (await api('/api/me')).json();renderShell();loadDashboard()}catch{renderLogin()}}
function renderShell(){document.body.innerHTML=`<div class="app"><header class="topbar"><div class="brandbox"><div class="brandmark">UFLS</div><div><div class="brandname">XLDV 2026</div><div class="brandsub">Theo dõi xếp lớp đầu vào tiếng Anh · ĐHĐN</div></div></div><div class="userbox"><span class="pill">${me.role}${me.school?' · '+me.school:''}</span><div class="avatar">${(me.username||'U')[0].toUpperCase()}</div></div></header><main class="main"><div class="hero"><div><h1>${state.tab==='dashboard'?'Tổng quan hệ thống':state.tab==='students'?'Danh sách & đối soát': 'Tra log hệ thống'}</h1><div class="muted">Dữ liệu vận hành từ Excel · MSSV là khóa đối soát chính · <span id="live" class="pill live">● realtime</span></div></div><div class="actions"><button class="btn secondary" onclick="doExport()">↗ Xuất báo cáo</button>${me.role==='ADMIN'?'<button class="btn secondary" onclick="importExcel()">＋ Nhập Excel</button>':''}<button class="btn danger" onclick="logout()">Đăng xuất</button></div></div><div class="nav"><button class="btn ${state.tab==='dashboard'?'active':''}" onclick="setTab('dashboard')">Tổng quan</button><button class="btn ${state.tab==='students'?'active':''}" onclick="setTab('students')">Danh sách & đối soát</button>${['ADMIN','BGH'].includes(me.role)?`<button class="btn ${state.tab==='audit'?'active':''}" onclick="setTab('audit')">Tra log</button>`:''}</div><div id="content"></div></main></div>`;openEvents()}
function filters(){return `<div class="panel filters"><input id="fsearch" class="input" placeholder="Tìm MSSV / họ tên / ngành"><input id="fschool" class="input" placeholder="CSGDĐHTV"><input id="fcohort" class="input" placeholder="Khóa"><input id="fmajor" class="input" placeholder="Ngành"><select id="flevel"><option value="">Mức</option><option>A2.1</option><option>A2.2</option><option>B1.1</option><option>B1.2</option></select><select id="fmethod"><option value="">Phương án</option><option>PA1</option><option>PA2</option><option>PA3</option></select><select id="falert"><option value="">Cảnh báo</option><option value="1">Có cảnh báo</option></select><button class="btn" onclick="reload()">Lọc</button></div>`}
function qs(){const x=new URLSearchParams();[['search','fsearch'],['school','fschool'],['cohort','fcohort'],['major','fmajor'],['level','flevel'],['method','fmethod'],['alert','falert']].forEach(([a,b])=>{const v=$('#'+b)?.value;if(v)x.set(a,v)});return x}
async function loadDashboard(){const c=$('#content');c.innerHTML=filters()+`<div id="dash"></div>`;try{const d=await (await api('/api/dashboard?'+qs())).json();$('#dash').innerHTML=`<div class="grid"><div class="panel kpi"><div class="ico">👥</div><div class="muted">Tổng sinh viên</div><b>${d.kpi.total}</b></div><div class="panel kpi"><div class="ico">✓</div><div class="muted">Đã xác định</div><b>${d.kpi.determined}</b></div><div class="panel kpi"><div class="ico">?</div><div class="muted">Chưa xác định</div><b>${d.kpi.missing}</b></div><div class="panel kpi"><div class="ico">⚠</div><div class="muted">Có cảnh báo</div><b>${d.kpi.alerts}</b></div></div><div class="charts"><div class="panel chart"><h3>Mức xếp lớp</h3>${chart(d.levels)}</div><div class="panel chart"><h3>Phương án sử dụng</h3>${chart(d.methods)}</div></div><div class="panel" style="padding:16px"><b>Trạng thái hệ thống:</b> <span class="status ok">Đang hoạt động</span> <span class="muted">Cập nhật máy chủ: ${new Date(d.serverTime).toLocaleString('vi-VN')}</span></div>`}catch(e){c.innerHTML='<div class="panel" style="padding:20px">'+e.message+'</div>'}}
function chart(a){if(!a.length)return '<div class="muted">Chưa có dữ liệu</div>';const max=Math.max(...a.map(x=>x.value),1);return `<div class="bar">${a.map(x=>`<i style="height:${Math.max(8,x.value/max*175)}px"><em>${x.value}</em><span>${x.label}</span></i>`).join('')}</div>`}
async function loadStudents(){const c=$('#content');c.innerHTML=filters()+`<div class="panel tableWrap"><table class="table"><thead><tr><th>MSSV</th><th>Họ tên</th><th>CSGDĐHTV</th><th>Khóa</th><th>Ngành</th><th>PA1</th><th>PA2</th><th>PA3</th><th>Mức cao nhất</th><th>Phương án</th><th>Trạng thái</th><th>Cảnh báo</th></tr></thead><tbody id="tb"></tbody></table></div>`;try{const rows=await (await api('/api/students?'+qs())).json();$('#tb').innerHTML=rows.map(r=>`<tr><td><b>${r.mssv}</b></td><td>${r.full_name||''}</td><td>${r.school||''}</td><td>${r.cohort||''}</td><td>${r.major||''}</td><td>${r.pa1_level||'-'} ${r.pa1_score??''}</td><td>${r.pa2_level||'-'} ${r.pa2_score??''}</td><td>${r.pa3_level||'-'} ${r.pa3_score??''}</td><td><span class="pill">${r.best_level||'Chưa xác định'}</span></td><td>${r.method||'-'}</td><td>${r.status||'-'}</td><td>${(r.alerts||[]).length?`<span class="pill alert">${r.alerts.join('; ')}</span>`:'<span class="pill ok">OK</span>'}</td></tr>`).join('')}catch(e){toast(e.message)}}
async function loadAudit(){const c=$('#content');c.innerHTML='<div class="panel tableWrap"><table class="table"><thead><tr><th>Thời gian</th><th>User</th><th>Role</th><th>CSGD</th><th>Action</th><th>Entity</th><th>Metadata</th></tr></thead><tbody id="tb"></tbody></table></div>';try{const rows=await (await api('/api/audit')).json();$('#tb').innerHTML=rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('vi-VN')}</td><td>${r.actor_username}</td><td>${r.role}</td><td>${r.school||''}</td><td><span class="pill">${r.action}</span></td><td>${r.entity||''}</td><td>${JSON.stringify(r.metadata||{})}</td></tr>`).join('')}catch(e){toast(e.message)}}
function setTab(t){state.tab=t;renderShell();if(t==='dashboard')loadDashboard();else if(t==='students')loadStudents();else loadAudit()}function reload(){if(state.tab==='dashboard')loadDashboard();else if(state.tab==='students')loadStudents()}
async function doExport(){try{const r=await api('/api/export?'+qs());const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bao_cao_xldv_2026.xlsx';a.click();URL.revokeObjectURL(a.href);toast('Đã xuất báo cáo')}catch(e){toast(e.message)}}
function importExcel(){const i=document.createElement('input');i.type='file';i.accept='.xlsx';i.onchange=async()=>{const fd=new FormData();fd.append('file',i.files[0]);try{const r=await api('/api/import/excel',{method:'POST',body:fd});const d=await r.json();toast(`Đã nhập ${d.rows} dòng`);reload()}catch(e){toast(e.message)}};i.click()}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('xldv_token');token=null;renderLogin()}let es;function openEvents(){if(es)es.close();if(!token)return;es=new EventSource('/api/events?token='+encodeURIComponent(token));es.addEventListener('data-updated',()=>{toast('Dữ liệu vừa được cập nhật — đang đồng bộ');reload()});es.onerror=()=>{$('#live')?.classList.add('alert')}}if(token)boot();else renderLogin();
</script></body></html>
