<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XLDV 2026</title><style>
:root{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1500px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand{font-size:24px;font-weight:800}.muted{color:#6b7280;font-size:13px}.panel{background:white;border:1px solid #e5eaf1;border-radius:16px;box-shadow:0 5px 20px #1d355710}.login{max-width:420px;margin:10vh auto;padding:30px}.input,select,button{font:inherit}.input,select{width:100%;padding:11px 12px;border:1px solid #d5dce7;border-radius:10px;background:#fff}.field{margin:12px 0}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#1f5eff;color:white;font-weight:700}.btn.secondary{background:#eef3ff;color:#1f5eff}.btn.danger{background:#fff0f0;color:#c62828}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{padding:18px}.kpi b{font-size:28px;display:block;margin-top:6px}.filters{padding:15px;display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-bottom:14px}.wide{grid-column:span 2}.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.chart{padding:16px;min-height:290px}.bar{height:210px;display:flex;align-items:end;gap:10px;padding:20px 8px 6px}.bar i{flex:1;background:#4778ff;border-radius:6px 6px 0 0;position:relative;min-width:20px}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:#555}.bar em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px 10px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}.table th{background:#fafbfd;position:sticky;top:0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3ff;color:#2454c5;font-size:12px}.alert{color:#b42318;background:#fff0ef}.ok{color:#147d43;background:#ecfdf3}.nav{display:flex;gap:8px;margin-bottom:15px}.nav button{background:white;color:#334155;border:1px solid #dce3ed}.nav button.active{background:#1f5eff;color:white;border-color:#1f5eff}.hidden{display:none}.status{font-size:12px;padding:6px 10px;border-radius:999px;background:#ecfdf3;color:#147d43}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:12px 15px;border-radius:10px;display:none;z-index:20}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(3,1fr)}.charts{grid-template-columns:1fr}}@media(max-width:700px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.wide{grid-column:span 1}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let token=localStorage.getItem('xldv_token'), me=null, state={tab:'dashboard'};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(url,opt);if(r.status===401){localStorage.removeItem('xldv_token');token=null;renderLogin();throw Error('Phiên hết hạn')}if(!r.ok){let e={};try{e=await r.json()}catch{};throw Error(e.error||'Có lỗi')}return r}
function toast(x){const t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function renderLogin(){document.body.innerHTML=`<div class="panel login"><div class="brand">XLDV 2026</div><p class="muted">Hệ thống xếp lớp đầu vào tiếng Anh — đăng nhập phân quyền.</p><div class="field"><label>Tài khoản</label><input id="u" class="input" value="admin"></div><div class="field"><label>Mật khẩu</label><input id="p" class="input" type="password" value="admin123"></div><button class="btn" style="width:100%" onclick="login()">Đăng nhập</button><p class="muted">Demo: admin/admin123 · bgh/bgh123 · dhspkt/dhspkt123</p></div>`}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.setItem('xldv_token',token);me=d.user;await boot()}catch(e){toast(e.message)}}
async function boot(){try{me=await (await api('/api/me')).json();renderShell();loadDashboard()}catch{renderLogin()}}
function renderShell(){document.body.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">XLDV 2026</div><div class="muted">Đối soát xếp lớp đầu vào · <span id="live" class="status">● realtime</span></div></div><div class="actions"><span class="pill">${me.role}${me.school?' · '+me.school:''}</span><button class="btn secondary" onclick="doExport()">Xuất báo cáo</button>${me.role==='ADMIN'?'<button class="btn secondary" onclick="importExcel()">Nhập Excel</button>':''}<button class="btn danger" onclick="logout()">Đăng xuất</button></div></div><div class="nav"><button class="btn ${state.tab==='dashboard'?'active':''}" onclick="setTab('dashboard')">Tổng quan</button><button class="btn ${state.tab==='students'?'active':''}" onclick="setTab('students')">Danh sách & đối soát</button>${['ADMIN','BGH'].includes(me.role)?`<button class="btn ${state.tab==='audit'?'active':''}" onclick="setTab('audit')">Tra log</button>`:''}</div><div id="content"></div></div>`;openEvents()}
function setTab(t){state.tab=t;renderShell();if(t==='dashboard')loadDashboard();else if(t==='students')loadStudents();else loadAudit()}
function filters(){return `<div class="panel filters"><input id="fsearch" class="input wide" placeholder="Tìm MSSV / họ tên / ngành"><input id="fschool" class="input" placeholder="CSGDĐHTV"><input id="fcohort" class="input" placeholder="Khóa"><input id="fmajor" class="input" placeholder="Ngành"><select id="flevel"><option value="">Mức</option><option>A2.1</option><option>A2.2</option><option>B1.1</option><option>B1.2</option></select><select id="fmethod"><option value="">Phương án</option><option>PA1</option><option>PA2</option><option>PA3</option></select><select id="falert"><option value="">Cảnh báo</option><option value="1">Có cảnh báo</option></select><button class="btn" onclick="reload()">Lọc</button></div>`}
function qs(){const x=new URLSearchParams();[['search','fsearch'],['school','fschool'],['cohort','fcohort'],['major','fmajor'],['level','flevel'],['method','fmethod'],['alert','falert']].forEach(([a,b])=>{const v=$('#'+b)?.value;if(v)x.set(a,v)});return x}
async function loadDashboard(){const c=$('#content');c.innerHTML=filters()+`<div id="dash"></div>`;try{const d=await (await api('/api/dashboard?'+qs())).json();$('#dash').innerHTML=`<div class="grid"><div class="panel kpi"><div class="muted">Tổng sinh viên</div><b>${d.kpi.total}</b></div><div class="panel kpi"><div class="muted">Đã xác định</div><b>${d.kpi.determined}</b></div><div class="panel kpi"><div class="muted">Chưa xác định</div><b>${d.kpi.missing}</b></div><div class="panel kpi"><div class="muted">Có cảnh báo</div><b>${d.kpi.alerts}</b></div></div><div class="charts"><div class="panel chart"><h3>Mức xếp lớp</h3>${chart(d.levels)}</div><div class="panel chart"><h3>Phương án sử dụng</h3>${chart(d.methods)}</div></div><div class="panel" style="padding:16px"><b>Cập nhật máy chủ:</b> ${new Date(d.serverTime).toLocaleString('vi-VN')} · <span class="muted">Dữ liệu được lưu trong PostgreSQL; Excel là nguồn nhập.</span></div>`}catch(e){c.innerHTML='<div class="panel" style="padding:20px">'+e.message+'</div>'}}
function chart(a){if(!a.length)return '<div class="muted">Chưa có dữ liệu</div>';const max=Math.max(...a.map(x=>x.value),1);return `<div class="bar">${a.map(x=>`<i style="height:${Math.max(8,x.value/max*170)}px"><em>${x.value}</em><span>${x.label}</span></i>`).join('')}</div>`}
async function loadStudents(){const c=$('#content');c.innerHTML=filters()+`<div class="panel tableWrap"><table class="table"><thead><tr><th>MSSV</th><th>Họ tên</th><th>CSGDĐHTV</th><th>Khóa</th><th>Ngành</th><th>PA1</th><th>PA2</th><th>PA3</th><th>Mức cao nhất</th><th>Phương án</th><th>Trạng thái</th><th>Cảnh báo</th></tr></thead><tbody id="tb"></tbody></table></div>`;try{const rows=await (await api('/api/students?'+qs())).json();$('#tb').innerHTML=rows.map(r=>`<tr><td><b>${r.mssv}</b></td><td>${r.full_name||''}</td><td>${r.school||''}</td><td>${r.cohort||''}</td><td>${r.major||''}</td><td>${r.pa1_level||'-'} ${r.pa1_score??''}</td><td>${r.pa2_level||'-'} ${r.pa2_score??''}</td><td>${r.pa3_level||'-'} ${r.pa3_score??''}</td><td><span class="pill">${r.best_level||'Chưa xác định'}</span></td><td>${r.method||'-'}</td><td>${r.status||'-'}</td><td>${(r.alerts||[]).length?`<span class="pill alert">${r.alerts.join('; ')}</span>`:'<span class="pill ok">OK</span>'}</td></tr>`).join('')}catch(e){toast(e.message)}}
async function loadAudit(){const c=$('#content');c.innerHTML='<div class="panel tableWrap"><table class="table"><thead><tr><th>Thời gian</th><th>User</th><th>Role</th><th>CSGD</th><th>Action</th><th>Entity</th><th>Metadata</th></tr></thead><tbody id="tb"></tbody></table></div>';try{const rows=await (await api('/api/audit')).json();$('#tb').innerHTML=rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('vi-VN')}</td><td>${r.actor_username}</td><td>${r.role}</td><td>${r.school||''}</td><td><span class="pill">${r.action}</span></td><td>${r.entity||''}</td><td>${JSON.stringify(r.metadata||{})}</td></tr>`).join('')}catch(e){toast(e.message)}}
function reload(){if(state.tab==='dashboard')loadDashboard();else if(state.tab==='students')loadStudents()}
async function doExport(){try{const r=await api('/api/export?'+qs());const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bao_cao_xldv_2026.xlsx';a.click();URL.revokeObjectURL(a.href);toast('Đã xuất báo cáo')}catch(e){toast(e.message)}}
function importExcel(){const i=document.createElement('input');i.type='file';i.accept='.xlsx';i.onchange=async()=>{const fd=new FormData();fd.append('file',i.files[0]);try{const r=await api('/api/import/excel',{method:'POST',body:fd});const d=await r.json();toast(`Đã nhập ${d.rows} dòng`);reload()}catch(e){toast(e.message)}};i.click()}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('xldv_token');token=null;renderLogin()}
let es;function openEvents(){if(es)es.close();if(!token)return;es=new EventSource('/api/events?token='+encodeURIComponent(token));es.onmessage=()=>{};es.addEventListener('data-updated',e=>{toast('Dữ liệu vừa được cập nhật — đang đồng bộ');reload()});es.onerror=()=>{$('#live')?.classList.add('alert')}}
if(token)boot();else renderLogin();
</script></body></html>
